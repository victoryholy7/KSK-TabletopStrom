<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KSK Crisis Command - Easy Mode</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--y:#ffd23f;--p:#ff4d8d;--c:#26d0ff;--g:#3ddc97;--o:#ff8a3d}
body{font-family:'Kanit','Noto Sans Thai',sans-serif;background:radial-gradient(circle at 20% 0%,#1d3d82,#0b1630 65%);color:#fff;height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}
header{display:flex;align-items:center;gap:18px;padding:12px 24px;background:linear-gradient(90deg,#ff4d8d,#ff8a3d,#ffd23f);color:#111;z-index:6}
header h1{font-weight:800;font-size:26px}
header small{display:block;font-weight:600;font-size:14px}
.pips{margin-left:auto;display:flex;gap:8px}
.pip{width:38px;height:38px;border-radius:50%;border:3px solid #111;background:#fff;font-weight:800;font-size:18px;cursor:pointer;font-family:inherit}
.pip.done{background:#3ddc97}.pip.now{background:#111;color:var(--y);transform:scale(1.15)}

main{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;padding:20px;min-height:0;overflow:auto}
.panel{background:rgba(20,38,77,.9);border:3px solid #2c4a92;border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:16px}

.badge{background:var(--y);color:#111;font-weight:800;padding:4px 16px;border-radius:999px;font-size:18px;display:inline-block;width:fit-content}
.rtitle{font-size:32px;font-weight:800;line-height:1.2}
.desc{font-size:20px;line-height:1.5;background:rgba(255,255,255,.08);padding:14px 18px;border-radius:14px;border-left:6px solid var(--y)}

/* ตัวเลือกง่ายๆ */
.choices{display:grid;gap:10px;margin-top:4px}
.choice-btn{background:rgba(255,255,255,.12);border:2px solid var(--c);color:#fff;padding:12px 16px;border-radius:12px;font-family:inherit;font-size:18px;font-weight:600;cursor:pointer;text-align:left;transition:all .2s}
.choice-btn:hover{background:rgba(38,208,255,.25);transform:translateX(4px)}
.choice-btn.selected{background:var(--g);color:#05301e;border-color:#fff}

/* ทรัพยากรกลาง */
.res-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.res-card{background:rgba(0,0,0,.3);border:2px solid rgba(255,255,255,.2);border-radius:14px;padding:12px;display:flex;align-items:center;justify-content:space-between}
.res-info b{display:block;font-size:18px}
.res-info span{font-size:13px;opacity:.7}
.res-btn{background:var(--y);border:none;border-radius:8px;width:38px;height:38px;font-weight:800;font-size:20px;cursor:pointer}

.controls{display:flex;flex-wrap:wrap;gap:10px;padding:12px 24px;justify-content:center;background:rgba(0,0,0,.3);z-index:6}
.controls button{font-family:inherit;font-weight:600;font-size:16px;border:none;border-radius:12px;padding:10px 18px;cursor:pointer;background:#fff;color:#111;box-shadow:0 4px 0 #8aa}
.controls button:active{transform:translateY(3px);box-shadow:none}
.controls .big{background:var(--p);color:#fff}.controls .go{background:var(--g)}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:20;display:none;place-items:center}
.overlay.show{display:grid}
.modal{background:#fff;color:#111;border-radius:28px;padding:30px 40px;max-width:800px;width:92%;max-height:92vh;overflow:auto}

/* จับเวลาใหญ่อยู่กลางจอเกมง่ายๆ */
.timer-box{display:flex;align-items:center;gap:16px;background:rgba(0,0,0,.25);padding:12px 18px;border-radius:14px}
.timer-num{font-size:36px;font-weight:800;color:var(--y);font-family:monospace}
</style>
</head>
<body>

<header>
  <div style="font-size:34px">🏥</div>
  <div><h1>KSK Crisis Command (Easy Mode)</h1><small>ซ้อมแผนพายุแบบง่าย สบายๆ ไม่ซับซ้อน</small></div>
  <div class="pips" id="pips"></div>
</header>

<main>
  <section class="panel">
    <div id="roundHeader"></div>
    <div class="desc" id="roundDesc"></div>
    <h3 style="font-size:18px;color:var(--c)">💡 เลือกมติของโรงพยาบาลในรอบนี้ (คลิกเพื่อเลือก):</h3>
    <div class="choices" id="roundChoices"></div>
  </section>

  <section class="panel">
    <div class="timer-box">
      <div>⏱️ เวลาปรึกษา</div>
      <div class="timer-num" id="timerTxt">05:00</div>
      <button onclick="toggleTimer()" style="margin-left:auto;padding:6px 12px;font-family:inherit;font-weight:600;border-radius:8px;border:none;cursor:pointer" id="timerBtn">เริ่มจับเวลา</button>
    </div>

    <h3 style="font-size:18px;color:var(--y)">🃏 ทรัพยากรกลางของโรงพยาบาล (คลิกปุ่มเพื่อใช้)</h3>
    <div class="res-grid" id="resGrid"></div>
    
    <div style="margin-top:auto;display:flex;gap:10px">
      <button class="choice-btn" style="flex:1;text-align:center;background:rgba(255,255,255,.1)" onclick="openMap()">🗺️ เปิดดูแผนผัง รพ.</button>
    </div>
  </section>
</main>

<div class="controls">
  <button class="go" onclick="nextRound()">👉 เหตุการณ์ถัดไป / เริ่มรอบใหม่</button>
  <button class="big" onclick="openSummary()">🏁 สรุปผลและจุดอ่อน</button>
  <button onclick="resetGame()">♻️ เริ่มใหม่ทั้งหมด</button>
</div>

<div class="overlay" id="sumO"><div class="modal" id="sumM"></div></div>
<div class="overlay" id="mapO" onclick="this.classList.remove('show')"><div class="modal" style="text-align:center"><h2 style="margin-bottom:10px">🗺️ แผนผังโรงพยาบาลเขาสุกิม</h2><img src="ksk-map.jpg" style="max-width:100%;border-radius:12px" alt="แผนผัง"><p style="margin-top:10px;color:#666">(คลิกพื้นหลังเพื่อปิด)</p></div></div>

<script>
const ROUNDS=[
{
 title:"รอบที่ 1: พายุเข้าเต็มแรง",
 icon:"🌪️",
 desc:"ลมกระโชกแรงมาก ต้นไม้ล้มทับสายไฟหลัก ทำให้ **ไฟฟ้าดับทั้งโรงพยาบาล** และมีน้ำรั่วที่ตึกผู้ป่วยใน!",
 choices:[
  "⚡ ใช้การ์ดเครื่องปั่นไฟสำรอง ทันที เพื่อกู้ไฟจุดสำคัญ (ER / ห้องผ่าตัด)",
  "🚶‍♂️ ย้ายผู้ป่วยในและอุปกรณ์ติดเตียงหนีจุดน้ำรั่ว ไปโซนอาคารปลอดภัยทันที"
],
 res:{gen:2, fix:1, net:1}
},
{
 title:"รอบที่ 2: วิกฤตซ้อน (เน็ตล่ม + ผู้ป่วยทะลัก)",
 icon:"⚡",
 desc:"ฟ้าผ่าเสาหลักระลอกสอง **ระบบคอมพิวเตอร์ (HIS/HOSxP) ล่มสนิท** และมีผู้บาดเจ็บจากพายุเข้ามา ER 5 ราย!",
 choices:[
  "📝 สลับใช้ระบบกระดาษ (Manual / Downtime Form) ลงทะเบียนและรักษาทันที",
  "📡 เปิดใช้ระบบอินเทอร์เน็ตสำรอง 5G เพื่อกู้ระบบฐานข้อมูลกลับมา"
],
 res:{gen:1, fix:1, net:1}
},
{
 title:"รอบที่ 3: เส้นทางถูกตัดขาด",
 icon:"🌳",
 desc:"ต้นไม้ใหญ่และดินสไลด์ **ปิดทางเข้า-ออกโรงพยาบาล** รถพยาบาลวิ่งออกไม่ได้ เจ้าหน้าที่เวรบ่ายติดอยู่ข้างนอก!",
 choices:[
  "📞 ประสาน ปภ. / อบต. นำเครื่องจักรมาเคลียร์ทางด่วน",
  "🚁 จัดระบบส่งต่อผู้ป่วยวิกฤตทางเลือก และบริหารกำลังคนภายในที่ติดอยู่ใน รพ."
],
 res:{gen:1, fix:0, net:1}
},
{
 title:"รอบที่ 4: ข่าวลือและน้ำมันใกล้หมด",
 icon:"📱",
 desc:"โซเชียลปล่อยข่าวปลอมว่า **'โรงพยาบาลปิดตัวแล้ว'** ทำให้ญาติแห่มาหน้า ER แน่นขนัด ในขณะที่น้ำมันปั่นไฟเหลือใช้อีกแค่ 30 นาที!",
 choices:[
  "📣 ทีมสื่อสารออกแถลงการณ์ด่วนผ่านเพจ รพ. ว่ายังเปิดให้บริการ พร้อมจัด จนท. ชี้แจงญาติ",
  "⛽ มอบหมายทีมอาคารรีบประสานขอซื้อ/เติมน้ำมันสำรองด่วนที่สุด"
],
 res:{gen:0, fix:0, net:1}
},
{
 title:"รอบที่ 5: บททดสอบสุดท้าย (พายุลูกที่ 2)",
 icon:"🌀",
 desc:"พายุลูกใหม่ลูกใหญ่กว่าเดิมซัดเข้ามาซ้ำ ผู้ป่วยวิกฤตที่ใช้เครื่องช่วยหายใจต้องการความเสถียรสูงสุด ทรัพยากรเหลือน้อยเต็มที!",
 choices:[
  "🤝 ระดมทุกทีมช่วยกันดูแลจุดวิกฤตสุดท้าย และทำ SITREP สรุปสถานการณ์ส่งผู้บริหาร",
  "📋 ตรึงกำลังและเตรียมพร้อมแผนฟื้นฟูสภาพ รพ. ทันทีที่พายุสงบ"
],
 res:{gen:0, fix:0, net:0}
}
];

let state={round:0, secs:300, running:false, res:{gen:2, fix:2, net:2, amb:2}, selectedChoice:-1, notes:""};
const $=id=>document.getElementById(id);

let timerId=null;
function toggleTimer(){
  state.running=!state.running;
  $('timerBtn').textContent=state.running?'หยุดเวลา':'เริ่มจับเวลา';
  if(state.running){
    timerId=setInterval(()=>{
      if(state.secs>0){
        state.secs--;
        let m=Math.floor(state.secs/60), s=state.secs%60;
        $('timerTxt').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
      }else{
        state.running=false;clearInterval(timerId);
        $('timerBtn').textContent='หมดเวลา!';
      }
    },1000);
  }else{
    clearInterval(timerId);
  }
}

function nextRound(){
  if(state.round<ROUNDS.length){
    state.round++;
  }else{
    openSummary();
    return;
  }
  state.secs=300; state.running=false; state.selectedChoice=-1;
  if(timerId) clearInterval(timerId);
  $('timerTxt').textContent='05:00';
  $('timerBtn').textContent='เริ่มจับเวลา';
  render();
}

function useRes(k){
  if(state.res[k]>0) state.res[k]--;
  else state.res[k]=2; // วนกลับถ้าหมด
  renderRes();
}

function renderRes(){
  const list=[
    {k:'gen', name:'เครื่องปั่นไฟสำรอง', icon:'⚡'},
    {k:'fix', name:'ทีมช่างซ่อมบำรุง', icon:'🔧'},
    {k:'net', name:'อินเทอร์เน็ต 5G', icon:'📡'},
    {k:'amb', name:'รถพยาบาลกลาง', icon:'🚑'}
  ];
  $('resGrid').innerHTML=list.map(r=>`
    <div class="res-card">
      <div class="res-info"><b>${r.icon} ${r.name}</b><span>เหลือ ${state.res[r.k]} ชิ้น</span></div>
      <button class="res-btn" onclick="useRes('${r.k}')">${state.res[r.k]}</button>
    </div>`).join('');
}

function renderPips(){
  $('pips').innerHTML=ROUNDS.map((_,i)=>`<button class="pip ${state.round===i+1?'now':state.round>i+1?'done':''}" onclick="state.round=${i+1};render()">${i+1}</button>`).join('');
}

function render(){
  renderPips(); renderRes();
  if(state.round===0){
    $('roundHeader').innerHTML=`<span class="badge">เตรียมพร้อม</span><div class="rtitle">🎮 KSK Crisis Command (Easy)</div>`;
    $('roundDesc').innerHTML=`ยินดีต้อนรับครับ! เกมนี้เราจะจำลองสถานการณ์พายุถล่มโรงพยาบาลแบบเข้าใจง่าย <b>ไม่ต้องกดคะแนนให้วุ่นวาย</b> แค่ช่วยกันอ่านเหตุการณ์ โหวตเลือกมติ และกดใช้ทรัพยากรร่วมกัน<br><br>👉 กดปุ่ม <b>"เหตุการณ์ถัดไป"</b> ด้านล่างเพื่อเริ่มรอบที่ 1 ได้เลยครับ`;
    $('roundChoices').innerHTML=`<button class="choice-btn" style="text-align:center;background:var(--y);color:#111" onclick="nextRound()">🚀 เริ่มเล่นรอบที่ 1 ทันที</button>`;
    return;
  }
  const r=ROUNDS[state.round-1];
  $('roundHeader').innerHTML=`<span class="badge">รอบที่ ${state.round} จาก 5</span><div class="rtitle">${r.icon} ${r.title}</div>`;
  $('roundDesc').innerHTML=r.desc;
  $('roundChoices').innerHTML=r.choices.map((c,i)=>`
    <button class="choice-btn ${state.selectedChoice===i?'selected':''}" onclick="state.selectedChoice=${i};render()">
      ✅ ทางเลือกที่ ${i+1}: ${c}
    /button>`).join('');
}

function openMap(){ $('mapO').classList.add('show'); }
function openSummary(){
  $('sumM').innerHTML=`
    <h2 style="font-size:30px;margin-bottom:10px;color:#1d3d82">🏁 สรุปผลการซ้อมแผน (Easy Mode)</h2>
    <p style="font-size:18px;margin-bottom:15px">ยอดเยี่ยมมากครับ! ทุกทีมได้ช่วยกันผ่านสถานการณ์วิกฤตพายุครบทั้ง 5 รอบแล้ว ทรัพยากรที่เหลืออยู่ของโรงพยาบาล:</p>
    <div style="background:#f4f7fb;padding:15px;border-radius:12px;margin-bottom:15px;font-size:18px">
      ⚡ เครื่องปั่นไฟเหลือ: <b>${state.res.gen}</b> | 🔧 ทีมช่างเหลือ: <b>${state.res.fix}</b><br>
      📡 เน็ต 5G เหลือ: <b>${state.res.net}</b> | 🚑 รถพยาบาลเหลือ: <b>${state.res.amb}</b>
    </div>
    <h3 style="margin-bottom:8px">📝 บันทึกจุดอ่อนและข้อเสนอแนะเพื่อผู้บริหาร:</h3>
    <textarea id="sumNotes" style="width:100%;height:100px;padding:10px;font-size:16px;border-radius:8px;border:1px solid #ccc">${state.notes}</textarea>
    <div style="margin-top:15px;display:flex;gap:10px">
      <button style="background:#3ddc97;border:none;padding:10px 20px;font-size:16px;font-weight:600;border-radius:8px;cursor:pointer" onclick="copySummary()">📋 คัดลอกสรุปไปใช้งาน</button>
      <button style="background:#eee;border:none;padding:10px 20px;font-size:16px;border-radius:8px;cursor:pointer" onclick="$('sumO').classList.remove('show')">ปิดหน้าต่าง</button>
    </div>`;
  $('sumO').classList.add('show');
}

function copySummary(){
  state.notes=$('sumNotes').value;
  const txt=`สรุปผลการซ้อมแผนพายุ รพ.เขาสุกิม (Easy Mode)\n- ทรัพยากรคงเหลือ: ปั่นไฟ ${state.res.gen}, ช่าง ${state.res.fix}, 5G ${state.res.net}, รถพยาบาล ${state.res.amb}\n- ข้อเสนอแนะ/จุดอ่อน:\n${state.notes||'-'}`;
  navigator.clipboard.writeText(txt).then(()=>alert('คัดลอกข้อความสรุปเรียบร้อย!'));
}

function resetGame(){
  if(confirm('ต้องการเริ่มเกมใหม่ทั้งหมดใช่ไหม?')){
    state={round:0, secs:300, running:false, res:{gen:2, fix:2, net:2, amb:2}, selectedChoice:-1, notes:""};
    if(timerId) clearInterval(timerId);
    render();
  }
}

render();
</script>
</body>
</html>
