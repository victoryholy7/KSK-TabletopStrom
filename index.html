<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KSK Crisis Command - 10 Mission Simulation</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--y:#ffd23f;--p:#ff4d8d;--c:#26d0ff;--g:#3ddc97;--dark:#0b1630}
body{font-family:'Kanit','Noto Sans Thai',sans-serif;background:radial-gradient(circle at 20% 0%,#1d3d82,var(--dark) 65%);color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:15px}
.container{max-width:960px;width:100%;margin:auto}

/* หน้าเลือกภารกิจ (10 เหตุการณ์) */
.hub-screen{padding:20px 0}
.hub-header{text-align:center;margin-bottom:25px}
.hub-header h1{font-size:36px;color:var(--y);margin-bottom:8px}
.hub-header p{font-size:17px;opacity:.8}
.mission-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-bottom:20px}
.mission-card{background:rgba(20,38,77,.8);border:3px solid #2c4a92;border-radius:18px;padding:20px;cursor:pointer;transition:all .3s;position:relative}
.mission-card:hover{transform:translateY(-50px);border-color:var(--y);background:rgba(20,38,77,1)}
.mission-card.completed{border-color:var(--g);background:rgba(61,220,151,.1)}
.mission-num{background:var(--y);color:#111;font-weight:800;padding:2px 10px;border-radius:99px;font-size:13px;display:inline-block;margin-bottom:8px}
.mission-card h3{font-size:20px;color:#fff;margin-bottom:6px}
.mission-card p{font-size:14px;opacity:.8;line-height:1.4}

/* หน้าจอเกมจำลองสถานการณ์รายขั้นตอน */
.game-screen{display:none;background:rgba(20,38,77,.95);border:3px solid #2c4a92;border-radius:22px;padding:25px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.game-header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid rgba(255,255,255,.1);padding-bottom:12px;margin-bottom:18px}
.mission-badge{background:var(--p);color:#fff;font-weight:800;padding:5px 14px;border-radius:99px;font-size:15px}
.tries-box{font-size:16px;color:var(--y);font-weight:600}

.step-title{font-size:24px;font-weight:800;color:var(--y);margin-bottom:8px}
.step-desc{font-size:17px;line-height:1.5;background:rgba(0,0,0,.3);padding:15px;border-radius:12px;border-left:6px solid var(--c);margin-bottom:18px}

.question-box{font-size:18px;font-weight:700;color:var(--c);margin-bottom:12px}
.options-grid{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:20px}
.option-btn{background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.2);color:#fff;padding:14px 18px;border-radius:12px;font-family:inherit;font-size:17px;font-weight:600;cursor:pointer;text-align:left;transition:all .2s}
.option-btn:hover:not(:disabled){background:rgba(38,208,255,.2);border-color:var(--c);transform:translateX(4px)}
.option-btn.correct{background:rgba(61,220,151,.3);border-color:var(--g);color:#fff}
.option-btn.wrong{background:rgba(255,77,141,.3);border-color:var(--p);opacity:.5}

.feedback-alert{display:none;padding:15px;border-radius:12px;margin-bottom:18px;font-size:16px;line-height:1.5;animation:fadeIn .3s}
.feedback-alert.success{background:rgba(61,220,151,.2);border:2px solid var(--g);color:#fff}
.feedback-alert.error{background:rgba(255,77,141,.2);border:2px solid var(--p);color:#fff}

.action-bar{display:flex;justify-content:space-between;align-items:center;border-top:2px solid rgba(255,255,255,.1);padding-top:15px}
.btn{background:#fff;color:#111;border:none;padding:10px 20px;border-radius:10px;font-family:inherit;font-weight:700;font-size:15px;cursor:pointer;transition:transform .1s}
.btn:hover{transform:scale(1.05)}
.btn-next{background:var(--g);color:#05301e}
.btn-map{background:var(--c);color:#05301e}

/* Modal แผนผัง */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;place-items:center;z-index:100;padding:20px}
.modal-content{background:#112240;border:3px solid var(--y);border-radius:20px;padding:25px;max-width:750px;width:100%;text-align:center;max-height:90vh;overflow:auto}
.modal-content img{width:100%;border-radius:12px;margin:15px 0;border:2px solid #fff}

@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<div class="container">
  
  <!-- หน้าเลือก 10 เหตุการณ์ (Mission Hub) -->
  <div class="hub-screen" id="hubScreen">
    <div class="hub-header">
      <h1>🏥 KSK Crisis Command: 10 ภารกิจวิกฤต รพ.</h1>
      <p>เลือกสถานการณ์จำลองเพื่อฝึกฝนขั้นตอนการปฏิบัติงาน ตัดสินใจเลือกเครื่องมือ ตัวละคร และทรัพยากรให้ถูกต้อง</p>
    </div>
    <div class="mission-grid" id="missionGrid"></div>
  </div>

  <!-- หน้าจอเกมจำลองสถานการณ์รายขั้นตอน -->
  <div class="game-screen" id="gameScreen">
    <div class="game-header">
      <div class="mission-badge" id="missionBadge">เหตุการณ์ที่ 1</div>
      <div class="tries-box" id="triesBox">❌ โอกาสผิดพลาด: 3/3 ครั้ง</div>
    </div>

    <div class="step-title" id="stepTitle"></div>
    <div class="step-desc" id="stepDesc"></div>

    <div class="question-box" id="questionText"></div>
    <div class="options-grid" id="optionsGrid"></div>

    <div class="feedback-alert" id="feedbackAlert"></div>

    <div class="action-bar">
      <button class="btn btn-map" onclick="openMapModal()">🗺️ ดูแผนผัง รพ.</button>
      <div style="display:flex;gap:10px">
        <button class="btn" style="background:#555;color:#fff" onclick="returnToHub()">🏠 เลือกเหตุการณ์อื่น</button>
        <button class="btn btn-next" id="nextBtn" onclick="nextStep()" style="display:none">ขั้นตอนถัดไป ➔</button>
      </div>
    </div>
  </div>

</div>

<!-- Modal แผนผัง รพ. -->
<div class="modal-overlay" id="mapModal" onclick="if(event.target===this)closeMapModal()">
  <div class="modal-content">
    <h2 style="color:var(--y)">🗺️ แผนผังโรงพยาบาลเขาสุกิม</h2>
    <p style="font-size:14px;opacity:.8">ใช้ประกอบการพิจารณาเลือกเส้นทางและจุดปฏิบัติการ</p>
    <img src="https://images.unsplash.com/photo-1586773860418-d37222d8fce3?auto=format&fit=crop&w=1200&q=80" alt="แผนผัง รพ.">
    <br>
    <button class="btn" onclick="closeMapModal()">ปิดหน้าต่าง</button>
  </div>
</div>

<script>
// ข้อมูล 10 เหตุการณ์วิกฤต (แต่ละเหตุการณ์มี 3 ขั้นตอนการดำเนินการที่ต้องเลือกให้ถูก)
const MISSIONS = [
  {
    id: 1,
    title: "1. พายุลมกระโชกแรง & ไฟดับทั้ง รพ.",
    desc: "พายุฤดูร้อนพัดเข้าพื้นที่จันทบุรีอย่างรุนแรง ต้นไม้ใหญ่ล้มทับสายไฟแรงสูง ส่งผลให้ไฟฟ้าดับสนิททั้งโรงพยาบาล",
    steps: [
      {
        desc: "<b>ขั้นตอนที่ 1:</b> การสั่งการเบื้องต้นเพื่อเปิดปฏิบัติการฉุกเฉิน",
        q: "ใครคือผู้มีอำนาจสูงสุดในการประกาศเปิดศูนย์ปฏิบัติการภาวะฉุกเฉิน (EOC) และควรสั่งการอย่างไร?",
        options: [
          { text: "🧑‍✈️ ผู้การเมฆ (ทีมบัญชาการ) สั่งเปิด EOC ทันที และประกาศแจ้งเตือนทุกแผนกผ่านวิทยุสื่อสาร", correct: true, exp: "ถูกต้อง! ผู้บัญชาการเหตุการณ์ต้องสั่งเปิด EOC เพื่อรวมศูนย์สั่งการ" },
          { text: "🩺 หมอใจดี (ทีมแพทย์) วิ่งไปดึงปลั๊กเครื่องมือแพทย์ทุกตัวด้วยตัวเอง", correct: false, exp: "ผิดบทบาทหน้าที่ ทีมแพทย์ต้องดูแลคนไข้ ไม่ใช่ผู้สั่งการ EOC หลัก" },
          { text: "🔧 ช่างกล้า (ทีมอาคาร) รอให้ไฟฟ้ากลับมาเองตามธรรมชาติโดยไม่ต้องทำอะไร", correct: false, exp: "ผิด! เกิดเหตุฉุกเฉินระดับนี้ต้องเปิด EOC ทันที จะรอไม่ได้" }
        ]
      },
      {
        desc: "<b>ขั้นตอนที่ 2:</b> การเลือกใช้เครื่องมือและอุปกรณ์พลังงานสำรอง",
        q: "ตู้จ่ายไฟหลักดับสนิท อุปกรณ์ใดและทรัพยากรใดต้องถูกใช้งานเป็นลำดับแรกเพื่อกู้ชีพ?",
        options: [
          { text: "⚡ สั่งเดินเครื่องปั่นไฟสำรอง (Generator) และใช้การ์ด 'ปั่นไฟ' จ่ายให้โซน ER / ICU ด่วน", correct: true, exp: "ถูกต้อง! เครื่องปั่นไฟสำรองคือหัวใจสำคัญในการจ่ายไฟให้จุดวิกฤต" },
          { text: "📱 แจกไฟฉายพกพาให้เจ้าหน้าที่เดินส่องทางเดินมืดๆ โดยไม่ต้องเปิดเครื่องปั่นไฟ", correct: false, exp: "ผิด! เครื่องมือแพทย์ในห้องฉุกเฉินต้องใช้ไฟฟ้าจากเครื่องปั่นไฟหลักเท่านั้น" },
          { text: "🔌 ใช้สายพ่วงลากต่อไฟมาจากบ้านพักภายนอกโรงพยาบาล", correct: false, exp: "ผิดกฎความปลอดภัยและเป็นไปไม่ได้ในทางปฏิบัติ" }
        ]
      },
      {
        desc: "<b>ขั้นตอนที่ 3:</b> การประสานงานภายนอกเพื่อขอความช่วยเหลือ",
        q: "หากน้ำมันเครื่องปั่นไฟสำรองคาดว่าจะหมดภายใน 2 ชั่วโมง ใครคือหน่วยงานภายนอกที่ต้องประสานเร่งด่วน?",
        options: [
          { text: "📣 น้องข่าวด่วน (ทีมสื่อสาร) ประสาน การไฟฟ้าส่วนภูมิภาค (PEA) และ ปภ. จังหวัด เพื่อขอสนับสนุนรถโมบายยูนิตและน้ำมันด่วน", correct: true, exp: "ถูกต้อง! ทีมสื่อสารต้องประสานหน่วยงานภายนอกเพื่อรองรับวิกฤตยืดเยื้อ" },
          { text: "🧑‍✈️ สั่งให้พนักงานขับรถขับรถเก๋งไปซื้อน้ำมันถังแกลลอนที่ปั๊มน้ำมันเองทีละถัง", correct: false, exp: "ไม่เพียงพอต่อการใช้งานของโรงพยาบาลขนาดใหญ่ในภาวะวิกฤต" },
          { text: "🩺 โทรแจ้งตำรวจจราจรให้มาช่วยทำแผลให้คนไข้", correct: false, exp: "ผิดประเด็น ปัญหาตอนนี้คือน้ำมันเครื่องปั่นไฟ ไม่ใช่เรื่องจราจร" }

      }
    ]
  },
  {
    id: 2,
    title: "2. ฟ้าผ่าซ้ำซ้อน & ระบบคอมพิวเตอร์ (HIS) ล่ม",
    desc: "ท่ามกลางไฟดับ ฟ้าผ่าลงเสาสัญญาณหลัก ทำให้อินเทอร์เน็ตและระบบสารสนเทศโรงพยาบาล (HIS/HOSxP) ล่มใช้งานไม่ได้",
    steps: [
      {
        desc: "<b>ขั้นตอนที่ 1:</b> การแก้ปัญหาเฉพาะหน้าด้านข้อมูลผู้ป่วย",
        q: "เมื่อระบบคอมพิวเตอร์ล่ม ทีมบริหารและเวชระเบียนต้องหยิบอุปกรณ์ใดมาใช้แทนทันที?",
        options: [
          { text: "📝 หยิบ 'Downtime Form (แบบฟอร์มกระดาษสำรองฉุกเฉิน)' ออกมาแจกทุกหน้างานเพื่อลงทะเบียนด้วยมือ", correct: true, exp: "ถูกต้อง! แผน BCP กำหนดให้ใช้ฟอร์มกระดาษทันทีเมื่อระบบสารสนเทศล่ม" },
          { text: "💻 รอให้ช่างไอทีรีบูต์เครื่องคอมพิวเตอร์ซ้ำๆ จนกว่าจะติด", correct: false, exp: "เสียเวลาและทำให้ผู้ป่วยตกค้างหน้าห้องตรวจจำนวนมาก" },
          { text: "🗣️ ให้เจ้าหน้าที่ตะโกนเรียกชื่อผู้ป่วยสลับกันไปมาด้วยปากเปล่า", correct: false, exp: "เกิดความผิดพลาดสูงมากในการจ่ายยาและรักษาพยาบาล" }
        ]
      },
      {
        desc: "<b>ขั้นตอนที่ 2:</b> การใช้การ์ดทรัพยากรดิจิทัลเพื่อกู้ระบบ",
        q: "ทีมสนับสนุนจะกู้คืนระบบเครือข่ายชั่วคราวได้อย่างไร เมื่อไฟฟ้าหลักยังไม่มา?",
        options: [
          { text: "📡 ใช้การ์ด '5G / เน็ตสำรอง' ร่วมกับแบตเตอรี่สำรองเร้าเตอร์ เพื่อต่อระบบทะเบียนฉุกเฉิน", correct: true, exp: "ถูกต้อง! เน็ตสำรอง 5G ช่วยให้ระบบเวชระเบียนออนไลน์บางส่วนกลับมาใช้งานได้" },
          { text: "🌲 ปีนขึ้นไปซ่อมเสาสัญญาณบนหลังคาตึกท่ามกลางพายุฝนฟ้าคะนอง", correct: false, exp: "อันตรายถึงชีวิตจากฟ้าผ่าซ้ำซ้อน ไม่อนุญาตให้ปฏิบัติงานกลางแจ้ง" },
          { text: "📻 เปิดวิทยุธานินทร์ฟังเพลงแก้เครียด", correct: false, exp: "ไม่ช่วยแก้ปัญหาระบบสารสนเทศล่ม" }
        ]
      },
      {
        desc: "<b>ขั้นตอนที่ 3:</b> การสื่อสารความเสี่ยงให้บุคลากรทราบ",
        q: "ใครควรเป็นผู้ออกประกาศแจ้งเตือนสถานการณ์ Downtime ให้แพทย์และพยาบาลทุกตึกรับทราบแนวทางปฏิบัติเดียวกัน?",
        options: [
          { text: "📣 ทีมบริหารและสื่อสาร ออกประกาศแนวปฏิบัติระบบกระดาษผ่านช่องทางกลุ่มไลน์ฉุกเฉินและวิทยุ", correct: true, exp: "ถูกต้อง! การสื่อสารภายในต้องรวดเร็วและเป็นทิศทางเดียวกัน" },
          { text: "😴 ปล่อยให้แต่ละแผนกงดให้บริการไปก่อนจนกว่าพายุจะสงบ", correct: false, exp: "ผิดหลักการให้บริการทางการแพทย์ฉุกเฉิน" },
          { text: "✉️ เขียนจดหมายใส่ขวดแก้วลอยน้ำไปแต่ละตึก", correct: false, exp: "ล้าสมัยและไม่ทันท่วงที" }

      }
    ]
  },
  {
    id: 3,
    title: "3. ต้นไม้ล้ม & ดินสไลด์ปิดทางเข้า รพ.",
    desc: "ดินสไลด์และต้นไม้ใหญ่โค่นล้มทับเส้นทางเข้า-ออกหลักของโรงพยาบาล รถพยาบาลฉุกเฉินไม่สามารถวิ่งผ่านออกไปได้",
    steps: [
      {
        desc: "<b>ขั้นตอนที่ 1:</b> การประเมินเส้นทางและประสานภายนอก",
        q: "ทีมใดต้องรับหน้าที่ประสานงานขอเครื่องจักรหนัก (รถแบ็คออฟ/เลื่อยยนต์) จากหน่วยงานภายนอก?",
        options: [
          { text: "🔧 ทีมสนับสนุน/อาคาร ประสาน ปภ. เทศบาล หรือค่ายทหารในพื้นที่ให้นำเครื่องจักรมาเคลียร์ทาง", correct: true, exp: "ถูกต้อง! ทีมอาคารและยานพาหนะต้องประสานหน่วยงานบรรเทาสาธารณภัยภายนอก" },
          { text: "🩺 ให้พยาบาลวิชาการถือเลื่อยตัดไม้ขนาดเล็กไปตัดเองที่หน้าประตู", correct: false, exp: "ต้นไม้ใหญ่เกินกำลังคนและเสี่ยงอันตราย" },
          { text: "📣 โทรเรียกบริษัทส่งอาหารมาส่งฟาสต์ฟู้ดแก้เครียด", correct: false, exp: "ไม่เกี่ยวข้องกับสถานการณ์ดินสไลด์ปิดถนน" }
        ]

// ตัวแปรสถานะเกมปัจจุบัน
let currentMission = null;
let currentStepIdx = 0;
let errorsLeft = 3;
let completedMissions = JSON.parse(localStorage.getItem('ksk_completed') || '[]');

const $ = id => document.getElementById(id);

// แสดงหน้า Hub เลือกภารกิจ
function renderHub() {
  $('hubScreen').style.display = 'block';
  $('gameScreen').style.display = 'none';

  let html = '';
  MISSIONS.forEach(m => {
    const isDone = completedMissions.includes(m.id);
    html += `
      <div class="mission-card ${isDone ? 'completed' : ''}" onclick="startMission(${m.id})">
        <span class="mission-num">เหตุการณ์ที่ ${m.id} / 10</span>
        <h3>${m.title}</h3>
        <p>${m.desc}</p>
        <div style="margin-top:12px;font-size:14px;color:${isDone ? 'var(--g)' : 'var(--y)'};font-weight:600">
          ${isDone ? '✔ ผ่านภารกิจแล้ว (คลิกเล่นซ้ำได้)' : '▶ เริ่มดำเนินการขั้นตอนนี้'}
        </div>
      </div>
    `;
  });
  $('missionGrid').innerHTML = html;
}

// เริ่มเล่นเหตุการณ์ที่เลือก
function startMission(id) {
  currentMission = MISSIONS.find(m => m.id === id);
  currentStepIdx = 0;
  errorsLeft = 3;

  $('hubScreen').style.display = 'none';
  $('gameScreen').style.display = 'block';
  loadStep();
}

// โหลดขั้นตอนปัจจุบัน
function loadStep() {
  const step = currentMission.steps[currentStepIdx];
  $('missionBadge').textContent = `ภารกิจที่ ${currentMission.id}: ขั้นตอนที่ ${currentStepIdx + 1} จาก 3`;
  $('triesBox').innerHTML = `❌ โอกาสผิดพลาด: ${errorsLeft}/3 ครั้ง`;
  $('stepTitle').textContent = currentMission.title;
  $('stepDesc').innerHTML = step.desc;
  $('questionText').textContent = step.q;

  // ซ่อนปุ่มถัดไปและแจ้งเตือน
  $('nextBtn').style.display = 'none';
  const alertBox = $('feedbackAlert');
  alertBox.style.display = 'none';
  alertBox.className = 'feedback-alert';

  // สุ่มสลับตัวเลือกข้อสอบเพื่อความสนุก
  let opts = [...step.options];
  opts.sort(() => Math.random() - 0.5);

  let html = '';
  opts.forEach((opt, idx) => {
    html += `<button class="option-btn" id="opt-${idx}" onclick='checkAnswer(${JSON.stringify(opt)}, ${idx})'>${opt.text}</button>`;
  });
  $('optionsGrid').innerHTML = html;
}

// ตรวจสอบคำตอบ
function checkAnswer(opt, btnIdx) {
  const alertBox = $('feedbackAlert');
  const btn = $(`opt-${btnIdx}`);

  if (opt.correct) {
    // เลือกถูก
    btn.className = 'option-btn correct';
    disableAllOptions();

    alertBox.innerHTML = `✅ <b>ยอดเยี่ยม! ตัดสินใจถูกต้อง:</b> ${opt.exp}`;
    alertBox.className = 'feedback-alert success';
    alertBox.style.display = 'block';

    // ถ้าผ่านครบ 3 ขั้นตอนของเหตุการณ์นี้
    if (currentStepIdx < currentMission.steps.length - 1) {
      $('nextBtn').style.display = 'block';
      $('nextBtn').textContent = 'ไปยังขั้นตอนถัดไป ➔';
    } else {
      // จบภารกิจนี้แล้ว
      if (!completedMissions.includes(currentMission.id)) {
        completedMissions.push(currentMission.id);
        localStorage.setItem('ksk_completed', JSON.stringify(completedMissions));
      }
      $('nextBtn').style.display = 'block';
      $('nextBtn').textContent = '🏆 สำเร็จภารกิจ! กลับหน้าหลัก';
      $('nextBtn').onclick = returnToHub;
    }
  } else {
    // เลือกผิด
    errorsLeft--;
    $('triesBox').innerHTML = `❌ โอกาสผิดพลาด: ${errorsLeft}/3 ครั้ง`;
    btn.className = 'option-btn wrong';
    btn.disabled = true;

    if (errorsLeft > 0) {
      alertBox.innerHTML = `⚠️ <b>ยังไม่ถูกต้องครับ:</b> ${opt.exp}<br><em>กรุณาวิเคราะห์แล้วลองเลือกใหม่อีกครั้ง (เหลือโอกาสอีก ${errorsLeft} ครั้ง)</em>`;
      alertBox.className = 'feedback-alert error';
      alertBox.style.display = 'block';
    } else {
      // ผิดครบ 3 ครั้ง เฉลยคำตอบที่ถูกแล้วพาไปต่อ
      disableAllOptions();
      highlightCorrectOption();
      alertBox.innerHTML = `❌ <b>โอกาสหมดลงแล้ว!</b> คุณตอบผิดครบ 3 ครั้ง<br><b>คำตอบที่ถูกต้องคือ:</b> ${getCorrectExp()}<br><em>ระบบจะพาคุณข้ามไปขั้นตอนถัดไป</em>`;
      alertBox.className = 'feedback-alert error';
      alertBox.style.display = 'block';

      // เปิดปุ่มไปต่อ
      setTimeout(() => {
        if (currentStepIdx < currentMission.steps.length - 1) {
          $('nextBtn').style.display = 'block';
          $('nextBtn').textContent = 'ไปยังขั้นตอนถัดไป (ผ่านแบบมีเงื่อนไข) ➔';
        } else {
          if (!completedMissions.includes(currentMission.id)) {
            completedMissions.push(currentMission.id);
            localStorage.setItem('ksk_completed', JSON.stringify(completedMissions));
          }
          $('nextBtn').style.display = 'block';
          $('nextBtn').textContent = '🏠 กลับหน้าหลัก';
          $('nextBtn').onclick = returnToHub;
        }
      }, 1500);
    }
  }
}

function disableAllOptions() {
  const btns = document.querySelectorAll('.option-btn');
  btns.forEach(b => b.disabled = true);
}

function highlightCorrectOption() {
  const step = currentMission.steps[currentStepIdx];
  const btns = document.querySelectorAll('.option-btn');
  btns.forEach(b => {
    step.options.forEach(opt => {
      if (opt.correct && b.textContent.includes(opt.text.substring(0, 15))) {
        b.className = 'option-btn correct';
      }
    });
  });
}

function getCorrectExp() {
  const step = currentMission.steps[currentStepIdx];
  const corr = step.options.find(o => o.correct);
  return corr ? corr.text + " (" + corr.exp + ")" : "";
}

// ไปขั้นตอนถัดไปในภารกิจเดิม
function nextStep() {
  if (currentStepIdx < currentMission.steps.length - 1) {
    currentStepIdx++;
    errorsLeft = 3;
    loadStep();
    // คืนค่าปุ่ม next เป็นฟังก์ชันปกติ
    $('nextBtn').onclick = nextStep;
  } else {
    returnToHub();
  }
}

function returnToHub() {
  renderHub();
}

function openMapModal() { $('mapModal').style.display = 'grid'; }
function closeMapModal() { $('mapModal').style.display = 'none'; }

// เริ่มต้นรันระบบ
renderHub();
</script>

</body>
</html>
